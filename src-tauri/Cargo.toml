[package]
name = "jh_Editor"
version = "0.1.0"
description = "J.H Editor- A block-based Markdown editor"
authors = ["J.H Editor Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.2.0", features = ["protocol-asset"] }
tauri-plugin-log = "2.2.0"
tauri-plugin-fs = { version = "2.2.0", features = ["watch"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-os = "2.2.0"
tauri-plugin-shell = "2.2.0"
tauri-plugin-clipboard-manager = "2"
clipboard-win = "5.0.0" 
chardetng = "0.1.17"
encoding_rs = "0.8.33"
ignore = "0.4"
crossbeam-channel = "0.5"
tauri-plugin-http = "2"
tauri-plugin-single-instance = "2"
quick-xml = "0.31"
portable-pty = "0.9.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3.32"
regex = "1.12.3"
calamine = "0.25.0"
memmap2 = "0.9"
memchr = "2"
ropey = "1.6"

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1
