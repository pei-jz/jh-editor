[package]
name = "jh_editor"
version = "0.3.4"
description = "A local-first editor for text, Markdown, tabular data and very large logs"
authors = ["J.H Editor Team"]
license = "MIT"
repository = "https://github.com/pei-jz/jh-editor"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.2.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-log = "2.2.0"
tauri-plugin-fs = { version = "2.2.0", features = ["watch"] }
tauri-plugin-dialog = "2.2.0"
tauri-plugin-os = "2.2.0"
tauri-plugin-shell = "2.2.0"
tauri-plugin-clipboard-manager = "2"
clipboard-win = "5.0.0" 
chardetng = "0.1.17"
encoding_rs = "0.8.33"
ignore = "0.4"
crossbeam-channel = "0.5"
tauri-plugin-http = "2"
# 更新の取得と検証。OS のコード署名とは別物で、こちらはプロジェクトの
# 鍵で署名された更新以外を受け付けない。
tauri-plugin-updater = "2"
# 更新の適用後に再起動するためだけに使う。
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
quick-xml = "0.31"
portable-pty = "0.9.0"
tokio = { version = "1", features = ["full"] }
futures = "0.3.32"
regex = "1.12.3"
# `dates` makes a date cell come back as a date. Without it every date in
# every sheet reads as its Excel serial number — "46056" where the sheet
# shows 2026/02/03. It pulls in chrono, which the tree already carries.
calamine = { version = "0.25.0", features = ["dates"] }
# Only to print what calamine hands back: ExcelDateTime converts to a chrono
# NaiveDateTime, and formatting one needs chrono's `alloc`, which calamine
# does not ask for itself. Same 0.4 the tree already builds.
chrono = { version = "0.4", default-features = false, features = ["alloc"] }
# Hands a previewed file to whatever the OS opens it with. tauri-plugin-shell
# has an `open` of its own, but the JS side of it is scoped to http/tel/mailto
# and its Rust side is deprecated; this is the crate underneath it, already
# built as one of its dependencies.
open = "5.3"
# .docx / .pptx previews: the OOXML parts are XML inside a zip, and
# quick-xml above already reads the XML. Same version calamine unpacks
# workbooks with, so nothing extra is built.
zip = { version = "1.1", default-features = false, features = ["deflate"] }
memmap2 = "0.9"
memchr = "2"
ropey = "1.6"

# インストール先を記録したレジストリ値を読むためだけに使う。ポータブルな
# exe から更新をかけると、インストーラは登録済みの場所へ入るので、手元の
# exe は古いまま残る。自分がインストールされた実体かどうかを、これで判定
# する。src-tauri/nsis/hooks.nsh が書いた値を読む。
[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"
# Dropped-file paths from WebView2 (commands/file_drop.rs). The same versions
# wry already uses, so nothing new is built or downloaded.
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
lto = true
strip = true
opt-level = "s"
codegen-units = 1
