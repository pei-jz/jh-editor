<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JHEditor おすすめエディタテーマ提案</title>
<style>
  :root {
    /* JHEditor dark-theme design tokens (approximated — dashboard.css not in this repo) */
    --bg: #1e1e1e;
    --sidebar: #252526;
    --header: #252526;
    --border: rgba(255,255,255,0.09);
    --text: #d4d4d4;
    --text-secondary: #858585;
    --accent: #3794ff;
    --hover: #2a2d2e;
    --radius: 6px;
    --font-mono: 'Cascadia Code','JetBrains Mono','Fira Code','HackGen Console',Consolas,monospace;
    --font-ui: system-ui,-apple-system,'Segoe UI','Helvetica Neue',sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-ui);
    font-size: 14px;
  }

  body {
    display: grid;
    grid-template-columns: 260px 1fr;
    grid-template-rows: 52px 1fr;
    grid-template-areas:
      "header header"
      "sidebar main";
  }

  /* ---------- Header ---------- */
  .app-header {
    grid-area: header;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 0 16px;
    background: var(--header);
    border-bottom: 1px solid var(--border);
  }
  .app-header .logo {
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.3px;
  }
  .app-header .logo .accent { color: var(--accent); }
  .app-header .subtitle {
    color: var(--text-secondary);
    font-size: 12px;
  }

  /* ---------- Sidebar ---------- */
  .app-sidebar {
    grid-area: sidebar;
    background: var(--sidebar);
    border-right: 1px solid var(--border);
    padding: 14px 10px;
    overflow-y: auto;
  }
  .app-sidebar .section-label {
    color: var(--text-secondary);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin: 0 6px 8px;
  }
  .theme-nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 10px 10px;
    margin-bottom: 4px;
    background: transparent;
    color: var(--text);
    border: none;
    border-radius: var(--radius);
    cursor: pointer;
    text-align: left;
    font-family: var(--font-ui);
    font-size: 13px;
    transition: background 0.12s;
  }
  .theme-nav-item:hover { background: var(--hover); }
  .theme-nav-item.active {
    background: rgba(55,148,255,0.14);
    color: #fff;
  }
  .swatch-dots { display: flex; gap: 4px; }
  .swatch-dots i {
    width: 14px; height: 14px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.18);
    display: inline-block;
  }

  /* ---------- Main ---------- */
  .app-main {
    grid-area: main;
    padding: 20px 24px;
    overflow-y: auto;
  }
  .intro h1 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .intro p { color: var(--text-secondary); max-width: 720px; line-height: 1.6; }

  .theme-card {
    margin-top: 22px;
    background: var(--sidebar);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
  }
  .theme-card-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    gap: 8px;
  }
  .theme-card-head h2 {
    font-size: 17px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  .theme-card-head .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 500;
    letter-spacing: 0.3px;
  }
  .theme-card-head .desc {
    color: var(--text-secondary);
    font-size: 13px;
  }

  .preview-wrap {
    padding: 18px;
    display: grid;
    grid-template-columns: 1fr 300px;
    gap: 18px;
  }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; grid-template-rows: 52px auto 1fr; grid-template-areas: "header" "sidebar" "main"; }
    .preview-wrap { grid-template-columns: 1fr; }
  }

  /* ---------- Live editor mockup ---------- */
  .mock-editor {
    display: grid;
    grid-template-rows: auto auto 1fr auto;
    border: 1px solid var(--mock-border, #555);
    border-radius: 8px;
    overflow: hidden;
    background: var(--mock-bg);
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    min-height: 340px;
  }
  .mock-tabs {
    display: flex;
    background: var(--mock-header);
    border-bottom: 1px solid var(--mock-border);
    padding: 0;
  }
  .mock-tab {
    padding: 8px 16px;
    font-size: 12px;
    color: var(--mock-tab-inactive);
    border-right: 1px solid var(--mock-border);
    cursor: default;
  }
  .mock-tab.active {
    background: var(--mock-active-tab);
    color: var(--mock-text);
    border-top: 2px solid var(--mock-accent);
    font-weight: 500;
  }
  .mock-breadcrumb {
    display: flex;
    gap: 8px;
    padding: 6px 14px;
    font-size: 11px;
    color: var(--mock-text-secondary);
    background: var(--mock-bg);
    border-bottom: 1px solid var(--mock-border);
  }
  .mock-code {
    padding: 12px 16px;
    overflow: auto;
    position: relative;
  }
  .mock-code pre {
    font-family: var(--font-mono);
    font-size: 12.5px;
    line-height: 1.7;
    white-space: pre;
  }
  .mock-statusbar {
    display: flex;
    justify-content: space-between;
    padding: 5px 12px;
    font-size: 11px;
    color: var(--mock-text-secondary);
    background: var(--mock-header);
    border-top: 1px solid var(--mock-border);
  }

  /* Syntax token classes -> mapped via theme vars */
  .tk-keyword   { color: var(--mock-hl-keyword); }
  .tk-control   { color: var(--mock-hl-control); }
  .tk-builtin   { color: var(--mock-hl-builtin); }
  .tk-string    { color: var(--mock-hl-string); }
  .tk-comment   { color: var(--mock-hl-comment); font-style: italic; }
  .tk-function  { color: var(--mock-hl-function); }
  .tk-variable  { color: var(--mock-hl-variable); }
  .tk-number    { color: var(--mock-hl-number); }
  .tk-operator  { color: var(--mock-hl-operator); }
  .tk-literal   { color: var(--mock-hl-literal); }

  .mock-gutter {
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 34px;
    background: var(--mock-bg);
    border-right: 1px solid var(--mock-border);
    color: var(--mock-gutter);
    text-align: right;
    padding: 12px 6px 12px 0;
    font-size: 12px;
    line-height: 1.7;
    user-select: none;
  }
  .mock-code .code-body { margin-left: 34px; }

  /* ---------- Palette panel ---------- */
  .palette-panel {
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px;
    background: var(--bg);
  }
  .palette-panel h3 {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-secondary);
    margin-bottom: 12px;
  }
  .palette-group { margin-bottom: 14px; }
  .palette-group .group-title {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 6px;
  }
  .palette-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .chip {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--hover);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 4px 8px;
    font-size: 11px;
    font-family: var(--font-mono);
  }
  .chip i {
    width: 16px; height: 16px;
    border-radius: 4px;
    border: 1px solid rgba(255,255,255,0.15);
    flex-shrink: 0;
  }
  .note {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.6;
    border-top: 1px solid var(--border);
    padding-top: 10px;
  }
  .note strong { color: var(--text); }
</style>
</head>
<body>

  <header class="app-header">
    <span class="logo">JH<span class="accent">Editor</span></span>
    <span class="subtitle">／ おすすめエディタテーマ提案（5候補）</span>
  </header>

  <aside class="app-sidebar">
    <div class="section-label">おすすめ候補</div>
    <div id="theme-nav"></div>
    <div class="section-label" style="margin-top:18px;">選定の観点</div>
    <div class="note" style="padding:6px 8px;border-top:none;">
      面白さ・格好よさ・唯一性・既存テーマとの整合性を考慮し、方向性の異なる5つを選定しました。
    </div>
  </aside>

  <main class="app-main">
    <div class="intro">
      <h1>エディタテーマ提案</h1>
      <p>
        JHEditor の既存テーマ（light / dark / midnight / latte / solarized×2 / paper×2 / bamboo-ancient）に加える、
        「面白い／格好いい」新テーマを5つ提案します。左のメニューから切り替えると、実際の配色と構文ハイライトをプレビューできます。
      </p>
    </div>
    <div id="theme-cards"></div>
  </main>

<script>
  // ---- Theme data (colors match themes.css token naming) ----
  const THEMES = [

      vars: {
        bg: '#0d0221', sidebar: '#15052e', header: '#120325', border: 'rgba(0,240,255,0.18)',
        text: '#e0e0ff', accent: '#ff2a9d', activeTab: '#0d0221', activeBorder: '#ff2a9d',
        hover: '#1d0a3a', textSecondary: '#7a7ab5', gutter: '#5b5b8f', tabInactive: '#7a7ab5',
        hlKeyword: '#00e5ff', hlControl: '#ff2a9d', hlBuiltin: '#39ff14', hlLiteral: '#00e5ff',
        hlString: '#ff2a9d', hlComment: '#8a6bd8', hlFunction: '#ffe74a', hlVariable: '#c9b8ff',
        hlNumber: '#39ff14', hlOperator: '#e0e0ff'
      },
      decoration: null,
      glow: '0 0 6px rgba(255,42,157,0.45)',
      dark: true,
      palette: [
        ['背景', '#0d0221'], ['サイド', '#15052e'], ['文字', '#e0e0ff'], ['アクセント(マゼンタ)', '#ff2a9d'],
        ['補助(シアン)', '#00f0ff'], ['キーワード', '#00e5ff'], ['文字列', '#ff2a9d'], ['関数', '#ffe74a']
      ]
    },
    {

      name: 'Sumi-e',

      tag: '唯一性 ★5',
      tagColor: '#c73e3a',
      desc: '生成りの和紙に墨色の文字、差し色は朱印の朱。既存の和・古風路線をライトで固める。',
      note: '既存 bamboo-ancient／paper と同系列の「和」をライトで確立。--grain を弱い和紙の繊維として流用し、明朝体（--font-textbook）をクロームに適用。',

        bg: '#f7f5f0', sidebar: '#ece8df', header: '#efece3', border: '#d8d2c4',
        text: '#1c1c1c', accent: '#c73e3a', activeTab: '#f7f5f0', activeBorder: '#c73e3a',
        hover: '#e9e4d8', textSecondary: '#9a958a', gutter: '#b3ac9c', tabInactive: '#9a958a',
        hlKeyword: '#2f4f7f', hlControl: '#7d5aa0', hlBuiltin: '#3a726d', hlLiteral: '#2f4f7f',
        hlString: '#a63a34', hlComment: '#9a958a', hlFunction: '#4a3f6b', hlVariable: '#3a3a3a',

      },
      decoration: null,
      glow: null,
      dark: false,
      palette: [
        ['背景(生成り)', '#f7f5f0'], ['サイド', '#ece8df'], ['文字(墨)', '#1c1c1c'], ['アクセント(朱)', '#c73e3a'],

    },
    {
      id: 'catppuccin-mocha',
      name: 'Catppuccin Mocha',
      jp: '定番ダーク',
      tag: '整合性 ★5',
      tagColor: '#cba6f7',
      desc: '既存 Latte のダーク側。落ち着いたベースに柔らかいパステルの構文色。',
      note: '既に Catppuccin Latte があるため、その Mocha（ダーク）を追加するとシリーズが完成。既存テーマとの整合性が最良で、選択肢として自然に馴染む。',
      vars: {
        bg: '#1e1e2e', sidebar: '#181825', header: '#1a1a29', border: '#313244',
        text: '#cdd6f4', accent: '#cba6f7', activeTab: '#1e1e2e', activeBorder: '#cba6f7',

        hlNumber: '#fab387', hlOperator: '#cdd6f4'
      },
      decoration: null,
      glow: null,
      dark: true,
      palette: [
        ['背景', '#1e1e2e'], ['サイド', '#181825'], ['文字', '#cdd6f4'], ['アクセント(モーヴ)', '#cba6f7'],

    },
    {
      id: 'nord',
      name: 'Nord',
      jp: '北極の青',

      desc: '北極の静かな青を基調とした、落ち着いた「格好いい」。長時間でも目が疲れにくい。',
      note: '低彩度のブルーグレーで統一された定番。フォーカスを維持しつつ穏やかなコントラストを両立し、実務向けの安定感がある。',
      vars: {
        bg: '#2e3440', sidebar: '#3b4252', header: '#343b49', border: '#434c5e',
        text: '#eceff4', accent: '#88c0d0', activeTab: '#2e3440', activeBorder: '#88c0d0',
        hover: '#3b4252', textSecondary: '#616e88', gutter: '#616e88', tabInactive: '#616e88',
        hlKeyword: '#81a1c1', hlControl: '#b48ead', hlBuiltin: '#8fbcbb', hlLiteral: '#81a1c1',
        hlString: '#a3be8c', hlComment: '#616e88', hlFunction: '#88c0d0', hlVariable: '#d8dee9',
        hlNumber: '#b48ead', hlOperator: '#eceff4'
      },
      decoration: null,
      glow: null,
      dark: true,
      palette: [
        ['背景', '#2e3440'], ['サイド', '#3b4252'], ['文字', '#eceff4'], ['アクセント', '#88c0d0'],
        ['キーワード', '#81a1c1'], ['文字列', '#a3be8c'], ['関数', '#88c0d0'], ['数値', '#b48ead']
      ]
    }
  ];

  // ---- Sample code (class tokens map to theme syntax vars) ----
  const SAMPLE_CODE = [
    [['tk-comment','// おすすめテーマのプレビュー'], null],
    [['tk-keyword','import'], ['tk-operator',' '], ['tk-variable','useState'], ['tk-operator',' '], ['tk-keyword','from'], ['tk-operator',' '], ['tk-string',"'react'"], null],
    [null, null],
    [['tk-keyword','const'], ['tk-operator',' '], ['tk-variable','Theme'], ['tk-operator',' = '], ['tk-function','generateTheme'], ['tk-operator','('], ['tk-variable','name'], ['tk-operator',') => {'], null],
    [['tk-operator','  '], ['tk-keyword','const'], ['tk-operator',' '], ['tk-variable','isDark'], ['tk-operator',' = '], ['tk-variable','name'], ['tk-operator',' !== '], ['tk-string',"'light'"], ['tk-operator',';'], null],
    [['tk-operator','  '], ['tk-keyword','return'], ['tk-operator',' { '], ['tk-variable','bg'], ['tk-operator',': '], ['tk-literal','0x0d0221'], ['tk-operator',', '], ['tk-variable','accent'], ['tk-operator',': '], ['tk-string',"'#ff2a9d'"], ['tk-operator',' }'], ['tk-operator',';'], null],
    [['tk-operator','};'], null]
  ];

  function renderSampleCode() {
    return SAMPLE_CODE.map(line => {
      if (!line) return '<span></span>';
      const html = line.map(item => {
        if (!item) return '';
        const [cls, txt] = item;
        return txt !== null && txt !== undefined
          ? `<span class="${cls}">${escapeHtml(txt)}</span>`
          : '';
      }).join('');
      return html || '<span></span>';
    }).join('\n');
  }
  function escapeHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  // ---- Render a single theme card ----
  function renderCard(t, index) {
    const v = t.vars;
    const mockVars = {
      '--mock-bg': v.bg,
      '--mock-header': v.header,
      '--mock-sidebar': v.sidebar,
      '--mock-border': v.border,
      '--mock-text': v.text,
      '--mock-accent': v.accent,
      '--mock-active-tab': v.activeTab,
      '--mock-active-border': v.activeBorder,
      '--mock-hover': v.hover,
      '--mock-text-secondary': v.textSecondary,
      '--mock-gutter': v.gutter,
      '--mock-tab-inactive': v.tabInactive,
      '--mock-hl-keyword': v.hlKeyword,
      '--mock-hl-control': v.hlControl,
      '--mock-hl-builtin': v.hlBuiltin,
      '--mock-hl-literal': v.hlLiteral,
      '--mock-hl-string': v.hlString,
      '--mock-hl-comment': v.hlComment,
      '--mock-hl-function': v.hlFunction,
      '--mock-hl-variable': v.hlVariable,
      '--mock-hl-number': v.hlNumber,
      '--mock-hl-operator': v.hlOperator
    };

    const styleText = Object.entries(mockVars).map(([k, val]) => `${k}: ${val};`).join(' ');

    // Decoration + glow
    let codeExtra = '';
    if (t.decoration) codeExtra = `background-image: ${t.decoration};`;
    let textExtra = '';
    if (t.glow) textExtra = `text-shadow: ${t.glow};`;

    const paletteChips = t.palette.map(([label, color]) =>
      `<span class="chip"><i style="background:${color}"></i>${label} ${color}</span>`
    );

    return `
    <section class="theme-card" id="card-${t.id}">
      <div class="theme-card-head">
        <h2>
          <span class="swatch-dots">
            <i style="background:${v.bg}"></i>
            <i style="background:${v.accent}"></i>
            <i style="background:${v.hlKeyword}"></i>
          </span>
          ${t.name}
          <span class="tag" style="color:${t.tagColor};border:1px solid ${t.tagColor}55">${t.tag}</span>
        </h2>
        <div class="desc">${t.jp} — ${t.desc}</div>
      </div>
      <div class="preview-wrap">
        <div class="mock-editor" style="${styleText}">
          <div class="mock-tabs">
            <div class="mock-tab active">theme.js</div>
            <div class="mock-tab">README.md</div>
            <div class="mock-tab">styles.css</div>
          </div>
          <div class="mock-breadcrumb">
            <span>src</span><span>›</span><span>styles</span><span>›</span><span>theme.js</span>
          </div>
          <div class="mock-code" style="${codeExtra}">
            <div class="mock-gutter">1<br>2<br>3<br>4<br>5<br>6<br>7</div>
            <div class="code-body" style="${textExtra}"><pre>${renderSampleCode()}</pre></div>
          </div>
          <div class="mock-statusbar">
            <span>● master*</span>
            <span>UTF-8</span>
            <span>Ln 6, Col 22</span>
            <span>TypeScript JSX</span>
          </div>
        </div>
        <div class="palette-panel">
          <h3>カラーパレット</h3>
          <div class="palette-group">
            <div class="group-title">UI / サーフェス</div>
            <div class="palette-row">${paletteChips.slice(0,4).join('')}</div>
          </div>
          <div class="palette-group">
            <div class="group-title">構文ハイライト</div>
            <div class="palette-row">${paletteChips.slice(4).join('')}</div>
          </div>
          <div class="note"><strong>実装のポイント：</strong>${t.note}</div>
        </div>
      </div>
    </section>`;
  }

  function renderAll() {
    document.getElementById('theme-cards').innerHTML = THEMES.map((t, i) => renderCard(t, i)).join('');
    const nav = document.getElementById('theme-nav');
    nav.innerHTML = THEMES.map(t => `
      <button class="theme-nav-item" data-id="${t.id}">
        <span class="swatch-dots">
          <i style="background:${t.vars.bg}"></i>
          <i style="background:${t.vars.accent}"></i>
          <i style="background:${t.vars.hlKeyword}"></i>
        </span>
        <span>${t.name}</span>
      </button>
    `).join('');
    nav.querySelectorAll('.theme-nav-item').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = btn.dataset.id;
        document.querySelectorAll('.theme-nav-item').forEach(b => b.classList.toggle('active', b === btn));
        const card = document.getElementById('card-' + id);
        if (card) card.scrollIntoView({ behavior: 'smooth', block: 'start' });
      });
    });
  }

  renderAll();
</script>
</body>
</html>
